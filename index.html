<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2e6fd1" />
  <title>Cuaca — Weather App</title>
  <meta name="description" content="Cek cuaca kota mana pun: suhu, prakiraan per jam, prakiraan 5 hari, dan detail cuaca." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Latar langit: dua layer di-crossfade lewat JS setiap kondisi cuaca berganti -->
  <div class="sky" aria-hidden="true">
    <div class="sky__layer sky__layer--a is-visible sky--clear-night"></div>
    <div class="sky__layer sky__layer--b"></div>
  </div>

  <div class="app">
    <form id="searchForm" class="search" autocomplete="off">
      <svg class="search__icon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M21 21l-4.35-4.35m1.35-5.15a7 7 0 11-14 0 7 7 0 0114 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        id="cityInput"
        class="search__input"
        type="text"
        placeholder="Cari kota, mis. Medan"
        aria-label="Nama kota"
        required
      />
      <button class="search__button" type="submit">Cari</button>
    </form>

    <div class="toolbar">
      <div id="historyRow" class="history" aria-label="Riwayat pencarian"></div>
      <div class="unit-switch" role="group" aria-label="Satuan suhu">
        <button type="button" class="unit-switch__btn is-active" data-unit="metric">°C</button>
        <button type="button" class="unit-switch__btn" data-unit="imperial">°F</button>
      </div>
    </div>

    <main id="content" class="content">
      <div class="placeholder">
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 18a4.5 4.5 0 01-.4-8.98 5.5 5.5 0 0110.9-1.02A4 4 0 0116.8 16"/>
        </svg>
        <p>Ketik nama kota di atas untuk melihat cuacanya sekarang.</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
